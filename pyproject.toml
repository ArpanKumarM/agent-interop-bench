[project]
name = "agenttrust"
version = "0.1.0"
description = "Reliability and security evaluation platform for MCP (and later A2A) agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-json-logger>=2.0",
    "jsonschema>=4.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "mock_servers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "mock_servers"]

[tool.ruff.format]
quote-style = "double"
