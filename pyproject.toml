[project]
name = "agent-interop-bench"
version = "0.1.0"
description = "Reliability, security, and interoperability testing for MCP and A2A agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "python-json-logger>=4.2.0",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "mock_servers", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "mock_servers"]

[tool.ruff.format]
quote-style = "double"
